schema_version: 1
taxonomy_version: "event-taxonomy-v3.0.0"
description: >-
  Deterministic event-subject rules for the 2022-2026 CLOB archive. Specific
  outcome/contract-form overrides and geographic guards are implemented in
  taxonomy.py. Otherwise, rules are evaluated in listed order, with either
  tag or title evidence. Generic tags no longer suppress all specific text
  matches. Classification is reproducible, not independently human-validated.

